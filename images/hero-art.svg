<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-label="Illustration of a receipt printer, thermal paper roll, label roll and ribbon spools">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f1f5ff"/><stop offset="1" stop-color="#dfe7fa"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9b73a"/><stop offset="0.55" stop-color="#f5a30f"/><stop offset="1" stop-color="#d98c00"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1238b5"/><stop offset="1" stop-color="#0a2380"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a3550"/><stop offset="0.5" stop-color="#0f172a"/><stop offset="1" stop-color="#0a0f1e"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a6bff"/><stop offset="0.5" stop-color="#1a4fd8"/><stop offset="1" stop-color="#0f2fa0"/></linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd56a"/><stop offset="0.5" stop-color="#f5b01a"/><stop offset="1" stop-color="#d98c00"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b6b"/><stop offset="0.5" stop-color="#d63a3a"/><stop offset="1" stop-color="#a42020"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- background shapes -->
  <circle cx="300" cy="330" r="262" fill="#e7eeff"/>
  <circle cx="300" cy="330" r="214" fill="#f3f7ff"/>
  <circle cx="488" cy="120" r="44" fill="#f5a30f"/>
  <circle cx="92" cy="540" r="58" fill="none" stroke="#1a97f7" stroke-width="8" opacity="0.4"/>
  <circle cx="545" cy="400" r="9" fill="#1a97f7" opacity="0.7"/>
  <circle cx="60" cy="210" r="7" fill="#f5a30f"/>

  <!-- floor shadows -->
  <ellipse cx="300" cy="590" rx="250" ry="22" fill="#0a2380" opacity="0.14" filter="url(#soft)"/>

  <!-- ribbon spools (back row) -->
  <g>
    <rect x="372" y="330" width="46" height="110" fill="url(#k)"/>
    <ellipse cx="395" cy="440" rx="23" ry="7" fill="#0a0f1e"/>
    <ellipse cx="395" cy="330" rx="23" ry="7" fill="#3b4663"/>
    <ellipse cx="395" cy="330" rx="12" ry="3.6" fill="#d9b38c"/>

    <rect x="424" y="352" width="46" height="90" fill="url(#b)"/>
    <ellipse cx="447" cy="442" rx="23" ry="7" fill="#0f2fa0"/>
    <ellipse cx="447" cy="352" rx="23" ry="7" fill="#5a83ff"/>
    <ellipse cx="447" cy="352" rx="12" ry="3.6" fill="#d9b38c"/>

    <rect x="476" y="322" width="46" height="120" fill="url(#y)"/>
    <ellipse cx="499" cy="442" rx="23" ry="7" fill="#d98c00"/>
    <ellipse cx="499" cy="322" rx="23" ry="7" fill="#ffd56a"/>
    <ellipse cx="499" cy="322" rx="12" ry="3.6" fill="#d9b38c"/>

    <rect x="526" y="362" width="46" height="80" fill="url(#r)"/>
    <ellipse cx="549" cy="442" rx="23" ry="7" fill="#a42020"/>
    <ellipse cx="549" cy="362" rx="23" ry="7" fill="#ff8a8a"/>
    <ellipse cx="549" cy="362" rx="12" ry="3.6" fill="#d9b38c"/>
  </g>

  <!-- receipt printer -->
  <g>
    <rect x="198" y="96" width="132" height="200" rx="6" fill="#ffffff" stroke="#cfd9f5" stroke-width="2"/>
    <g fill="#c9d3ee">
      <rect x="214" y="118" width="70" height="7" rx="3"/>
      <rect x="214" y="136" width="100" height="6" rx="3"/>
      <rect x="214" y="152" width="84" height="6" rx="3"/>
      <rect x="214" y="168" width="96" height="6" rx="3"/>
    </g>
    <g fill="#0a2380">
      <rect x="216" y="196" width="4" height="40"/><rect x="223" y="196" width="2" height="40"/><rect x="228" y="196" width="6" height="40"/>
      <rect x="237" y="196" width="2" height="40"/><rect x="242" y="196" width="4" height="40"/><rect x="249" y="196" width="3" height="40"/>
      <rect x="255" y="196" width="6" height="40"/><rect x="264" y="196" width="2" height="40"/><rect x="269" y="196" width="4" height="40"/>
      <rect x="276" y="196" width="2" height="40"/><rect x="281" y="196" width="5" height="40"/><rect x="289" y="196" width="3" height="40"/>
      <rect x="295" y="196" width="4" height="40"/><rect x="302" y="196" width="2" height="40"/>
    </g>
    <rect x="150" y="262" width="228" height="124" rx="22" fill="url(#navy)"/>
    <rect x="160" y="252" width="208" height="26" rx="12" fill="#13309f"/>
    <rect x="180" y="258" width="168" height="8" rx="4" fill="#06124a"/>
    <rect x="184" y="312" width="100" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
    <circle cx="334" cy="320" r="8" fill="#f5a30f"/>
    <rect x="184" y="334" width="60" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- POS thermal paper roll (lying, end visible) -->
  <g>
    <rect x="130" y="408" width="120" height="166" fill="url(#paper)"/>
    <ellipse cx="250" cy="491" rx="20" ry="83" fill="#dfe7fa"/>
    <circle cx="130" cy="491" r="83" fill="#ffffff" stroke="#d3dcf3" stroke-width="2"/>
    <circle cx="130" cy="491" r="62" fill="none" stroke="#e6ecfa" stroke-width="2"/>
    <circle cx="130" cy="491" r="42" fill="none" stroke="#e6ecfa" stroke-width="2"/>
    <circle cx="130" cy="491" r="27" fill="#ccd6ee"/>
    <circle cx="130" cy="491" r="16" fill="#8d9fcb"/>
    <path d="M250 568 q 40 14 84 4 l -6 -22 q -34 8 -78 -4z" fill="#ffffff" stroke="#d3dcf3" stroke-width="2"/>
  </g>

  <!-- label roll (lying, amber labels) -->
  <g>
    <rect x="332" y="462" width="104" height="132" fill="url(#amber)"/>
    <g stroke="#fff" stroke-opacity="0.55" stroke-width="2"><path d="M332 490h104M332 518h104M332 546h104M332 574h104"/></g>
    <ellipse cx="436" cy="528" rx="17" ry="66" fill="#c98200"/>
    <circle cx="332" cy="528" r="66" fill="#ffffff" stroke="#e1c27a" stroke-width="2"/>
    <circle cx="332" cy="528" r="52" fill="#f5a30f"/>
    <circle cx="332" cy="528" r="36" fill="#ffffff" opacity="0.9"/>
    <circle cx="332" cy="528" r="22" fill="#f1d9a0"/>
    <circle cx="332" cy="528" r="12" fill="#b88a2a"/>
  </g>

  <!-- floating barcode label card -->
  <g transform="rotate(7 482 208)">
    <rect x="428" y="170" width="116" height="78" rx="12" fill="#ffffff" stroke="#d3dcf3" stroke-width="2"/>
    <rect x="428" y="170" width="116" height="16" rx="8" fill="#f5a30f"/>
    <g fill="#0a2380">
      <rect x="442" y="198" width="3" height="34"/><rect x="449" y="198" width="6" height="34"/><rect x="459" y="198" width="2" height="34"/>
      <rect x="465" y="198" width="5" height="34"/><rect x="474" y="198" width="3" height="34"/><rect x="481" y="198" width="6" height="34"/>
      <rect x="491" y="198" width="2" height="34"/><rect x="497" y="198" width="4" height="34"/><rect x="505" y="198" width="3" height="34"/>
      <rect x="512" y="198" width="5" height="34"/><rect x="521" y="198" width="2" height="34"/>
    </g>
  </g>

  <!-- quality tick -->
  <g>
    <circle cx="86" cy="262" r="30" fill="#1a97f7"/>
    <path d="M72 262l10 10 20-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
